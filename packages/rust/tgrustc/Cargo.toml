[package]
name = "tgrustc"
authors = ["Tangram <root@tangram.dev>"]
description = "A RUSTC_WRAPPER that spawns cacheable tangram processes for rustc invocations."
edition = "2024"
homepage = "https://www.tangram.dev"
license = "MIT"
publish = false
repository = "https://github.com/tangramdotdev/packages"
rust-version = "1.91"
version = "0.0.0"

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"

[dependencies]
rustix = { version = "1", features = ["stdio"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
tangram_client = { default-features = false, git = "https://github.com/tangramdotdev/tangram", rev = "e6e9b68c0a7bac557a4e456c5196e5abe49e848e" }
tokio = { version = "1", default-features = false, features = ["rt", "fs"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
which = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
