[package]
name = "tgrustc"
authors = ["Tangram <root@tangram.dev>"]
description = "A RUSTC_WRAPPER that spawns cacheable tangram processes for rustc invocations."
edition = "2024"
homepage = "https://www.tangram.dev"
license = "MIT"
publish = false
repository = "https://github.com/tangramdotdev/packages"
rust-version = "1.100"
version = "0.0.0"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"

[dependencies]
proxy = { path = "../../std/packages/proxy" }
rustix = { version = "1", features = ["stdio"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
tangram_client = { default-features = false, git = "https://github.com/tangramdotdev/tangram", rev = "815ace09c8f5bddb12ba8490e7f753c7179613f4" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "fs"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
which = "8"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
