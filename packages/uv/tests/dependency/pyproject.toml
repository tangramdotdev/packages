[project]
name = "greeter"
version = "0.1.0"
description = "A project with a pure Python dependency."
requires-python = ">=3.13"
dependencies = [
    "cowsay==6.1",
    "pywin32==311; sys_platform == 'win32'",
]

[project.scripts]
greeter = "greeter:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
