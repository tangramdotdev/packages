[project]
name = "devgroup"
version = "0.1.0"
description = "A project whose dev group is locked with a digest that does not match."
requires-python = ">=3.13"
dependencies = ["cowsay==6.1"]

[project.scripts]
devgroup = "devgroup:main"

[dependency-groups]
dev = ["iniconfig==2.3.0"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
